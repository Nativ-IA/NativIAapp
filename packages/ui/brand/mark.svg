<!--
  NativIA · símbolo "La semilla que pregunta"

  Un brote de dos hojas cuyo tallo se curva hasta convertirse en un signo de
  interrogación, con la semilla como punto. Codifica la tesis del producto:
  aquí la IA no entrega respuestas, hace crecer preguntas.

  Las dos hojas no son decorativas. Con una sola hoja el símbolo se lee como un
  signo de interrogación corriente a tamaños pequeños; el par de cotiledones es
  lo único que sobrevive a 24 px como brote. Verificado en apps/web/public/marca.html.

  Usa currentColor: hereda el color del contexto y sobrevive a impresión
  monocroma y a `forced-colors`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NativIA">
  <title>NativIA</title>
  <g transform="translate(1,-2)">
    <path d="M31 47 V30 c0-6 3-8 7-10 c6-3 6-11-1-13 c-6-2-11 1-12 6"
          fill="none" stroke="currentColor" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 44 C21 47 12 42 9 32 C20 29 28 35 30 44 Z" fill="currentColor"/>
    <path d="M32 47 C38 49 45 46 47 39 C39 36 33 40 32 47 Z" fill="currentColor"/>
    <circle cx="31" cy="58" r="4" fill="currentColor"/>
  </g>
</svg>
